name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farahevent_user
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: farahevent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farahevent_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: farahevent-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: farahevent-backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Ajouté le 2026-07-17, APRÈS avoir résorbé les advisories (36 -> 2) : un scan
      # branché sur une CI déjà rouge se fait désactiver dans la semaine. Il est
      # BLOQUANT — c'est tout son intérêt.
      #
      # `ecdsa` et `pyasn1` restent ignorés : leurs versions sont ÉPINGLÉES par
      # python-jose (`pyasn1<0.5.0`), aucun correctif n'est atteignable sans quitter
      # cette lib. `ecdsa` n'a d'ailleurs aucun correctif publié. Ignorer un
      # advisory sans écrire pourquoi, c'est le rendre invisible pour toujours.
      # Le vrai correctif = migrer vers PyJWT (ni ecdsa ni pyasn1) — à planifier.
      - name: Audit des dépendances (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-2263

      - name: Run tests
        env:
          APP_ENV: development
          DEBUG: "False"
          DB_NULLPOOL: "1"
          DATABASE_URL: postgresql+asyncpg://farahevent_user:devpassword@localhost:5432/farahevent_test
        # Seuil 60 % : plancher posé juste sous le réel mesuré (64 % au 2026-07-17).
        # Un seuil qu'on n'atteint pas se désactive au bout de deux semaines ; un
        # plancher sous le réel empêche la régression et se relève à chaque palier.
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    name: Frontend — lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farahevent-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: farahevent-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # NON bloquant, volontairement : les 4 advisories high de Next 14 n'ont AUCUN
      # correctif dans la branche 14.x (npm propose Next 16 = breaking). Rendre ce
      # scan bloquant aujourd'hui, c'est une CI rouge en permanence — donc une CI
      # qu'on cesse de lire. Il reste ici pour rendre VISIBLE toute NOUVELLE vuln.
      # À passer bloquant avec la migration Next 16 (S4).
      - name: Audit npm (informatif)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Absent jusqu'au 2026-07-17 : lint + typecheck ne compilent pas le projet.
      # Une régression de build passait donc la CI et n'apparaissait qu'au déploiement.
      # NEXT_PUBLIC_USE_MOCK=0 : la CI doit construire ce que la prod construira.
      - name: Build
        env:
          NEXT_PUBLIC_USE_MOCK: "0"
        run: npm run build
